name: Compatibility report
description: Report a Protect feature, a synthetic check or a community installation trial.
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Parity claims need native evidence: what Protect itself saved or showed, not a callback HTTP 200, a counter or a capability flag. **Describe results in words and counts; never attach frames, captions, transcripts or identifiers.**
  - type: input
    id: protect
    attributes:
      label: Protect version
      description: >-
        Enter the installed version if known. Use "no controller" for a fixture-only run
        or "not reached" if setup stopped before you could check.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Emulator commit or image tag
      description: Include the full public source commit or image digest when available.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Test environment
      description: >-
        Give the OS, CPU architecture, runtime and version, processor profile, and camera
        family used or planned. Omit device names and network addresses.
      placeholder: e.g. Linux arm64, Docker 28, AI Key, G4 series
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature
      description: Include the public model name and revision if the result depends on a model.
      placeholder: e.g. Find Anything search, AI Port person detection, transcripts
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Feature outcome
      description: >-
        Use Blocked if a prerequisite stopped the test, or Unsupported if the project's
        compatibility guide documents that limit.
      options: ["Passed", "Failed", "Blocked", "Unsupported", "Not run"]
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      options:
        - "native-verified: read back from Protect (exact-event GET, native search, UI after reload)"
        - "fixture-tested only"
        - "callback or counter only (not native evidence)"
        - "no readback available"
    validations:
      required: true
  - type: textarea
    id: readback
    attributes:
      label: How you read the result back
      description: >-
        Name the screen, route or fixture and give the expected and observed states or counts.
        If you could not check a result, say where you stopped.
    validations:
      required: true
  - type: textarea
    id: trial
    attributes:
      label: Community installation trial (optional)
      description: |
        Say whether this is an independent installation, a maintainer run or a follow-up to an earlier public report. Link that report if available.
        For each step give passed, failed, blocked or not run. Include a sanitized error code for a failed step if available.
      placeholder: |
        Installation context:
        Install: source build, release package or container image
        Update: previous and new versions
        Recovery: procedure used and what you verified afterwards
        Native caption: was it visible on the original event after reloading Protect?
  - type: textarea
    id: missing
    attributes:
      label: What is still missing (needs_evidence)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials, media, transcripts, identities or private network details.
          required: true
