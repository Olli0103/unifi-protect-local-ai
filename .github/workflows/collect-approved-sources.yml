# Temporary owner-authorized source handoff; removed before the evidence-only PR merges.
name: Collect owner-approved upstream sources
'on':
  push:
    branches: [openclaw/mild-langoustine]
    paths:
      - .github/workflows/collect-approved-sources.yml
      - tools/collect_approved_sources.py
      - docs/legal/approved-upstream-sources-manifest.json
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'Olli0103/unifi-protect-local-ai' && github.actor == 'Olli0103'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fetch only approved exact public original bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python tools/collect_approved_sources.py \
            --manifest docs/legal/approved-upstream-sources-manifest.json \
            --destination "${RUNNER_TEMP}/approved-upstream-sources"
      - name: Retain verified originals, not a release candidate
        id: originals
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: approved-upstream-sources-e97fc8ea
          path: ${{ runner.temp }}/approved-upstream-sources/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Record provider artifact identity
        env:
          ORIGINALS_ARTIFACT_ID: ${{ steps.originals.outputs.artifact-id }}
          ORIGINALS_ARTIFACT_DIGEST: ${{ steps.originals.outputs.artifact-digest }}
        run: |
          printf 'Original source artifact: %s; SHA-256: %s\n' "${ORIGINALS_ARTIFACT_ID}" "${ORIGINALS_ARTIFACT_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
